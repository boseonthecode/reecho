[package]
name = "reecho-service"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Reecho background service — hotspot lifecycle, NetworkManager/hostapd orchestration"

[dependencies]
reecho-shared = { path = "../shared" }
zbus = { version = "5", features = ["tokio", "bus-impl"] }
tokio = { version = "1", features = ["full"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
