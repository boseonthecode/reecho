[package]
name = "reecho-cli"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Reecho command-line interface"

[dependencies]
reecho-shared = { path = "../shared" }
clap = { version = "4", features = ["derive"] }
zbus = { version = "5", features = ["tokio", "bus-impl"] }
tokio = { version = "1", features = ["rt", "macros"] }
